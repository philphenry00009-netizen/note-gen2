name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # only used to attach APKs to a Release on v* tags
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      # Finds the Gradle project wherever it is: repo root, a subfolder, or inside a
      # .zip that was uploaded to the repo as a file (GitHub does not unzip those).
      - name: Locate project
        id: locate
        run: |
          set -e
          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            zip=$(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*' | head -n1 || true)
            if [ -n "$zip" ]; then
              echo "Unzipping $zip"
              mkdir -p "$RUNNER_TEMP/unzipped"
              unzip -q -o "$zip" -d "$RUNNER_TEMP/unzipped"
            fi
          fi
          settings=$(find . "$RUNNER_TEMP/unzipped" -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) 2>/dev/null | head -n1 || true)
          if [ -z "$settings" ]; then
            echo "::error::No settings.gradle(.kts) found. Repo contents:"
            ls -la
            exit 1
          fi
          dir=$(realpath "$(dirname "$settings")")
          echo "Project directory: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode release keystore (optional)
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Build release APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle assembleRelease --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameScribe-debug-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameScribe-release-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APKs to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/release/*.apk
